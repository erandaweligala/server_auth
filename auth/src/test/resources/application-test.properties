# Test configuration
quarkus.log.level=INFO
quarkus.log.console.enable=true

# Test database configuration
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=

# Test Redis configuration
quarkus.redis.hosts=redis://localhost:6379

# Test authentication configuration
radius.accept.attributes=role,department,level
auth.algorithm.method=AES
auth.AES.secret.key.value=TestSecretKey123

# Circuit breaker test configuration
mp.fault-tolerance.circuit-breaker.enabled=true
mp.fault-tolerance.retry.enabled=true
mp.fault-tolerance.timeout.enabled=true

# Test logging
quarkus.log.category."com.csg.airtel.aaa4j".level=DEBUG
