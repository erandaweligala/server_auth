quarkus:
  micrometer:
    enabled: true
    binder-enabled-default: false
    binder:
      jvm:
        enabled: true
      system:
        enabled: true
      http-server:
        enabled: true
      vertx:
        enabled: true


    export:
      prometheus:
        enabled: true
        path: /q/metrics
    vertx:
      enabled: true
      metrics:
        options:
          enabled: true
          registry-name: micrometer
  # Enable HTTP/2 for better multiplexing
  http:
    http2: true
    host: 0.0.0.0
    port: 8083
  # ===== DATABASE CONNECTION POOL =====
  datasource:
    db-kind: oracle
    username: aaa
    password: Aaa!89nky78D
    reactive:
      #url: oracle:thin:@localhost:1521/FREEPDB1
      url: oracle:thin:@localhost:1524/ORCL
  # Increase event loop timeout for first request

  vertx:
    event-loops-pool-size: 2         # 1 core pod → 2 event loops sufficient (Kafka + Redis/HTTP I/O)
    internal-blocking-pool-size: 16  # Match consumer concurrency (16) + 4 headroom for other blocking ops
    warning-exception-time: 10s
    max-event-loop-execute-time: 5s
    max-worker-execute-time: 60s
    prefer-native-transport: true
    caching: false

  thread-pool:
    core-threads: 16                 # 16 consumer + 4 for HTTP/scheduled/other ops
    max-threads: 32                  # Modest burst headroom - avoids excessive context switching on 1 core
    queue-size: 1000                 # Backpressure-aware consumer prevents unbounded queue buildup
    growth-resistance: 0
    shutdown-timeout: 30s

  console:
    color: true
  log:
    level: INFO
    console:
      format: "[%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ}] %-5p [%c][%t][%X{traceId}][%X{userName}][%X{sessionId}] %s%e%n"
      async:
        queue-length: 4096
        overflow: discard
      enabled: true

    # File Configuration
    file:
      path: /var/log/dte/${HOSTNAME:unknown}.log
      format: "[%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ}] %-5p [%c][%t][%X{traceId}][%X{userName}][%X{sessionId}] %s%e%n"
      async:
        enable: true
        queue-length: 8192
        overflow: discard
      rotation:
        max-file-size: 100M
        max-backup-index: 15
        rotate-on-boot: true
      enabled: true
      level: ERROR

    category:
      "org.apache.kafka":
        level: INFO
      "io.smallrye.reactive.messaging.kafka":
        level: INFO
      "io.quarkus.config":
        level: INFO
      "io.smallrye.config":
        level: INFO
      "com.csg.airtel.aaa4j":
        level: INFO

  banner:
    enabled: false
  redis:
    hosts: redis://localhost:6379
    max-pool-size: 50                # 350 TPS/pod x 5ms = ~1.75 concurrent; 50 = safe headroom (150 created 1500 total across 10 pods)
    max-waiting-handlers: 1000
    max-pool-waiting: 500
    pool-recycle-timeout: 240000
    reconnect-attempts: 3
    reconnect-interval: 500
    pool-cleaner-interval: 20000
    response-timeout: 3000
    connection-timeout: 2000

  devservices:
    enabled: false

auth:
  algorithm:
    method: AES
  AES:
    secret:
      key:
        value: 12345678
  isCheckBucket: true

radius:
  accept:
    attributes: SESSION_TIMEOUT,IDLE_TIMEOUT

pool:
  max-size: 30
  connection-timeout: 5000
  idle-timeout: 600000
  max-lifetime: 1800000
  acquire-increment: 8
  prepared-statement-cache-max-size: 512
  pipelining-enabled: true
  pipelining-limit: 32              # Keep LOW for Oracle
  event-loop-size: 16
  tcp-keep-alive: true
  tcp-no-delay: true
  pool-cleaner-enabled: true
  pool-cleaner-interval: 60000
