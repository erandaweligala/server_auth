quarkus:
  micrometer:
    enabled: true
    binder-enabled-default: false
    binder:
      jvm:
        enabled: true
      system:
          enabled: true
      http-server:
          enabled: true
      vertx:
         enabled: true


    export:
      prometheus:
        enabled: true
        path: /q/metrics
    vertx:
      enabled: true
      metrics:
        options:
          enabled: true
          registry-name: micrometer
  # Enable HTTP/2 for better multiplexing
  http:
    http2: true
    host: 0.0.0.0
    port: 8083
  # ===== DATABASE CONNECTION POOL =====
  datasource:
    db-kind: oracle
    username: "${DB_USER}"
    password: "${DB_PASSWORD}"
    reactive:
      url: oracle:thin:@aaa-dev.cn8eyeqma3tp.ap-southeast-2.rds.amazonaws.com:1521/ORCL
      # Reactive connection pool configuration
      initial-size: 10
      max-size: 30
      acquisition-timeout: 10s
      idle-timeout: 30s
      max-lifetime: PT30M
  # Increase event loop timeout for first request

  vertx:
    event-loops-pool-size: 2         # 1 core pod → 2 event loops sufficient (Kafka + Redis/HTTP I/O)
    internal-blocking-pool-size: 16  # Match consumer concurrency (16) + 4 headroom for other blocking ops
    warning-exception-time: 10s
    max-event-loop-execute-time: 5s
    max-worker-execute-time: 60s
    prefer-native-transport: true
    caching: false

  thread-pool:
    core-threads: 16                 # 16 consumer + 4 for HTTP/scheduled/other ops
    max-threads: 32                  # Modest burst headroom - avoids excessive context switching on 1 core
    queue-size: 1000                 # Backpressure-aware consumer prevents unbounded queue buildup
    growth-resistance: 0
    shutdown-timeout: 30s

  console:
    color: true
  log:
    level: INFO
    console:
      format: "[%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ}] %-5p [%c][%t][%X{traceId}][%X{userName}][%X{sessionId}] %s%e%n"
      async:
        queue-length: 4096
        overflow: discard
      enabled: true

    # File Configuration
    file:
      path: /var/log/dte/${HOSTNAME:unknown}.log
      format: "[%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ}] %-5p [%c][%t][%X{traceId}][%X{userName}][%X{sessionId}] %s%e%n"
      async:
        enable: true
        queue-length: 8192
        overflow: discard
      rotation:
        max-file-size: 100M
        max-backup-index: 15
        rotate-on-boot: true
      enabled: true
      level: ERROR

    category:
      "org.apache.kafka":
        level: INFO
      "io.smallrye.reactive.messaging.kafka":
        level: INFO
      "io.quarkus.config":
        level: INFO
      "io.smallrye.config":
        level: INFO
      "com.csg.airtel.aaa4j":
        level: INFO

  banner:
    enabled: false\
  redis:
    client-type: sentinel
    hosts: redis://redis-cluster-headless.cluster-redis.svc.cluster.local:26379
    master-name: "${REDIS_MASTER_NAME}"
    role: "${REDIS_ROLE}"
    password: "${REDIS_PASSWORD}"!
    max-pool-size: 48               # Right-sized for concurrency 16: max ~32 concurrent Redis ops + headroom
    max-waiting-handlers: 500      # Reduced - backpressure prevents unbounded waiting
    max-pool-waiting: 256
    pool-recycle-timeout: 240000
    reconnect-attempts: 3
    reconnect-interval: 500
    pool-cleaner-interval: 20000
    timeout: 120000

  devservices:
    enabled: false

auth:
  algorithm:
    method: "${ENCRYPTION_TYPE}"
  AES:
    secret:
      key:
        value: "${ENCRYPTION_SECRET_KEY}"
  isCheckBucket: true

radius:
  accept:
    attributes: SESSION_TIMEOUT,IDLE_TIMEOUT

pool:
  max-size: 30
  connection-timeout: 5000
  idle-timeout: 600000
  max-lifetime: 1800000
  acquire-increment: 8
  prepared-statement-cache-max-size: 512
  pipelining-enabled: true
  pipelining-limit: 32              # Keep LOW for Oracle
  event-loop-size: 16
  tcp-keep-alive: true
  tcp-no-delay: true
  pool-cleaner-enabled: true
  pool-cleaner-interval: 60000
